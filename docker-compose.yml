name : marketplace

services:
  # ---------- Database ----------
  db:
    build: ./db-init
    image: ${DOCKERHUB_USERNAME:-local}/marketplace-db:latest
    container_name: marketplace-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql                         # data tetap tersimpan
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---------- Backend (Express) ----------
  backend:
    build: ./back-end
    image: ${DOCKERHUB_USERNAME:-local}/marketplace-backend:latest
    container_name: marketplace-backend
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy

  # ---------- Frontend (React + Nginx) ----------
  frontend:
    build:
      context: ./front-end
      args:
        REACT_APP_API_URL: ${API_URL}
    image: ${DOCKERHUB_USERNAME:-local}/marketplace-frontend:latest
    container_name: marketplace-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  db_data:
